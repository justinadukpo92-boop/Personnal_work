<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JUSTINTIK PRO - Téléchargeur TikTok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
    * { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes pulse-wa {
      0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
      70% { box-shadow: 0 0 0 18px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }
    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(300%); }
    }
    @keyframes fadeIn { from {opacity:0; transform:translateY(-6px)} to {opacity:1; transform:translateY(0)} }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM en UMD (fonctionne même en file://) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Babel pour transformer le JSX -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useRef, useEffect } = React;

    // ---------- Normalisation des réponses API ----------
    function fromTikwm(payload) {
      const d = payload?.data || payload;
      if (!d || !(d.play || d.hdplay)) return null;
      return {
        title:      d.title || 'Vidéo TikTok',
        author:     d.author?.nickname || d.author?.unique_id || 'TikTok',
        handle:     d.author?.unique_id ? '@' + d.author.unique_id : '@tiktok',
        avatar:     d.author?.avatar || '',
        cover:      d.cover || d.origin_cover || '',
        video_hd:   d.hdplay || d.play || '',
        video_full: d.play || d.hdplay || '',
        video_wm:   d.wmplay || '',
        music:      d.music || d.music_info?.play || '',
      };
    }

    function fromTikly(payload) {
      const v = payload?.video;
      if (!v || !(v.noWatermark || v.watermark)) return null;
      return {
        title:      payload.title || payload.desc || 'Vidéo TikTok',
        author:     payload.author?.nickname || 'TikTok',
        handle:     payload.author?.unique_id ? '@' + payload.author.unique_id : '@tiktok',
        avatar:     payload.author?.avatar || '',
        cover:      payload.cover || payload.thumbnail || '',
        video_hd:   v.noWatermarkHD || v.noWatermark || '',
        video_full: v.noWatermark || v.watermark || '',
        video_wm:   v.watermark || '',
        music:      payload.music?.playUrl || '',
      };
    }

    const normalize = (raw) => fromTikwm(raw) || fromTikly(raw);

    // ---------- Les 3 niveaux de fallback ----------
    const LEVELS = [
      {
        n: 1, name: '/api/download',
        run: (url) =>
          fetch(`/api/download?url=${encodeURIComponent(url)}`).then((r) => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          }),
      },
      {
        n: 2, name: 'tikwm',
        run: (url) =>
          fetch('https://www.tikwm.com/api/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ url, hd: '1' }),
          }).then((r) => r.json()),
      },
      {
        n: 3, name: 'tiklydown',
        run: (url) =>
          fetch(`https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(url)}`)
            .then((r) => r.json()),
      },
    ];

    // ---------- Téléchargement forcé (blob) ----------
    async function forceDownload(src, filename) {
      if (!src) throw new Error('Lien indisponible');
      const res = await fetch(src);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const href = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = href;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(href), 5000);
    }

    // ============================================================
    // COMPOSANT PRINCIPAL
    // ============================================================
    function App() {
      const [url, setUrl]       = useState('');
      const [loading, setLoad]  = useState(false);
      const [level, setLevel]   = useState(null);
      const [error, setError]   = useState(null);
      const [info, setInfo]     = useState(null);
      const [toast, setToast]   = useState(null);
      const inputRef            = useRef(null);

      useEffect(() => { document.title = 'JUSTINTIK PRO - Téléchargeur TikTok'; }, []);

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const paste = async () => {
        setError(null);
        try {
          const text = await navigator.clipboard.readText();
          if (text) {
            setUrl(text);
            notify('Lien collé ✓');
          } else {
            setError('Presse-papiers vide. Colle avec Ctrl+V.');
          }
        } catch {
          setError("Autorise l'accès au presse-papiers ou colle manuellement (Ctrl+V).");
        }
        inputRef.current?.focus();
      };

      const download = async () => {
        const clean = url.trim();
        if (!clean || !clean.includes('tiktok')) {
          setError('Colle un lien TikTok valide. Ex: https://vm.tiktok.com/...');
          notify('Lien invalide ❌');
          return;
        }

        setLoad(true);
        setError(null);
        setInfo(null);

        for (const lvl of LEVELS) {
          setLevel(lvl.n);
          notify(`Level ${lvl.n} → ${lvl.name}`);
          try {
            const raw = await lvl.run(clean);
            const found = normalize(raw);
            if (found && (found.video_hd || found.video_full)) {
              setInfo(found);
              setLoad(false);
              notify(`Succès Level ${lvl.n} ✓`);
              return;
            }
          } catch (e) {
            console.warn(`Level ${lvl.n} échec`, e);
          }
        }

        setLoad(false);
        setError('Tous les serveurs sont occupés. Réessaie dans 5 secondes ou contacte-nous sur WhatsApp.');
        notify('Échec total — WhatsApp dispo');
      };

      const grab = async (src, name) => {
        if (!src) { notify('Lien indisponible ❌'); return; }
        notify('Préparation du fichier...');
        try {
          await forceDownload(src, name);
          notify('Téléchargement lancé ✓');
        } catch (e) {
          window.open(src, '_blank', 'noopener');
          notify('Ouverture directe (téléchargement manuel)');
        }
      };

      const handleFile = info?.handle?.replace('@', '') || 'tiktok';

      return (
        <div className="min-h-screen bg-[#fcfcfd] text-[#0a0a0f] selection:bg-[#00f2ea]/20 font-[Inter,system-ui,sans-serif] antialiased">

          {toast && (
            <div className="fixed top-[76px] left-1/2 -translate-x-1/2 z-[70] pointer-events-none">
              <div className="px-4 py-2 rounded-full bg-black text-white text-[12px] font-bold shadow-xl" style={{ animation: 'fadeIn 0.2s' }}>{toast}</div>
            </div>
          )}

          <header className="sticky top-0 z-50 backdrop-blur-xl bg-white/80 border-b border-black/[0.06]">
            <div className="max-w-[1120px] mx-auto px-5 md:px-8 h-[68px] flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-[36px] h-[36px] rounded-[10px] flex items-center justify-center font-black text-[18px] text-white" style={{ background: 'linear-gradient(135deg, #00f2ea 0%, #ff0050 100%)' }}>J</div>
                <div className="leading-none">
                  <div className="font-black tracking-[-0.03em] text-[16px]">JUSTINTIK</div>
                  <div className="text-[10px] font-bold tracking-[0.14em] text-black/40 -mt-[1px]">VERSION IV PRO</div>
                </div>
                <div className="hidden md:flex items-center gap-2 ml-4 pl-4 border-l border-black/10">
                  <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-black text-white text-[11px] font-semibold tracking-wide">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" /> PRO ● En ligne
                  </span>
                </div>
              </div>
            </div>
          </header>

          <a href="https://wa.me/22897782786" target="_blank" rel="noopener" aria-label="WhatsApp"
             className="fixed bottom-[22px] right-[22px] w-[60px] h-[60px] rounded-full bg-[#25D366] flex items-center justify-center shadow-[0_12px_28px_rgba(37,211,102,0.45)] z-[9999] hover:scale-[1.05] transition-transform"
             style={{ animation: 'pulse-wa 2.2s infinite' }}>
            <svg viewBox="0 0 24 24" width="30" height="30" fill="white">
              <path d="M19.05 4.94A9.91 9.91 0 0 0 12.04 2a9.93 9.93 0 0 0-8.61 14.95L2 22l5.2-1.36A9.93 9.93 0 0 0 12.04 22a9.91 9.91 0 0 0 7.01-2.95A9.9 9.9 0 0 0 22 12.02a9.87 9.87 0 0 0-2.95-7.08ZM12.04 20a7.92 7.92 0 0 1-4.03-1.1l-.29-.17-3.09.81.82-3.01-.19-.31A7.93 7.93 0 0 1 4.06 12a7.96 7.96 0 0 1 7.98-7.98A7.96 7.96 0 0 1 20 12a7.93 7.93 0 0 1-7.96 8Zm4.35-5.93c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.02-.37.1-.49.1-.1.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.41-.54-.42h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2 0 1.18.86 2.32.98 2.48.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.1.16 1.51.1.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28Z" />
            </svg>
          </a>

          <main className="max-w-[1120px] mx-auto px-5 md:px-8">
            <section className="pt-10 md:pt-16 pb-10">
              <div className="grid md:grid-cols-[1.15fr_0.85fr] gap-10 items-start">
                <div>
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-black/[0.04] border border-black/[0.06] text-[11px] font-semibold tracking-wide mb-5">
                    <span className="w-2 h-2 rounded-full bg-[#00f2ea]" /> ANTI-BLOCAGE ACTIF • 3 NIVEAUX • 99.9% UPTIME
                  </div>
                  <h1 className="text-[40px] md:text-[58px] font-black tracking-[-0.04em] leading-[0.92] mb-4">
                    Télécharge <span className="bg-gradient-to-r from-[#00f2ea] to-[#ff0050] bg-clip-text text-transparent">TikTok</span><br />sans filigrane. PRO.
                  </h1>
                  <p className="text-[16px] md:text-[18px] leading-[1.5] text-black/60 max-w-[560px] font-medium">
                    Rebuild V4 complet. Architecture triple fallback, preview instantanée, HD & MP3. Optimisé mobile & desktop.
                  </p>

                  <div className="mt-8 bg-white rounded-[20px] border border-black/[0.08] shadow-[0_16px_40px_rgba(0,0,0,0.06)] p-3 md:p-4">
                    <div className="flex flex-col md:flex-row gap-3">
                      <div className="flex-1 relative">
                        <div className="absolute left-4 top-1/2 -translate-y-1/2 text-black/30">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                          </svg>
                        </div>
                        <input
                          ref={inputRef}
                          value={url}
                          onChange={(e) => setUrl(e.target.value)}
                          placeholder="Colle ton lien TikTok ici... https://www.tiktok.com/@..."
                          className="w-full h-[52px] pl-11 pr-4 rounded-[14px] bg-[#f6f6f8] border border-black/[0.06] outline-none focus:border-black/20 focus:bg-white text-[15px] font-medium placeholder:text-black/30 transition"
                        />
                      </div>
                      <div className="flex gap-2">
                        <button onClick={paste} className="h-[52px] px-5 rounded-[14px] bg-white border border-black/10 text-[14px] font-semibold hover:bg-black/[0.04] transition flex items-center gap-2 shrink-0">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" />
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3" />
                          </svg>
                          Coller
                        </button>
                        <button onClick={download} disabled={loading} className="h-[52px] px-7 rounded-[14px] bg-black text-white text-[15px] font-bold tracking-[-0.01em] hover:bg-black/90 active:scale-[0.98] transition disabled:opacity-50 flex items-center gap-2 shrink-0">
                          {loading ? (
                            <>
                              <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                              Niveau {level}...
                            </>
                          ) : (
                            <>
                              Télécharger
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                                <path d="M5 12h14" /><path d="M12 5l7 7-7 7" />
                              </svg>
                            </>
                          )}
                        </button>
                      </div>
                    </div>

                    <div className="mt-3 flex items-center gap-2 text-[11px] font-semibold tracking-wide">
                      {LEVELS.map((l) => (
                        <div key={l.n} className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full border ${level && level >= l.n ? 'bg-black text-white border-black' : 'bg-black/5 border-black/10 text-black/40'}`}>
                          <span className={`w-1.5 h-1.5 rounded-full ${level === l.n && loading ? 'bg-[#00f2ea] animate-pulse' : level && level > l.n ? 'bg-emerald-400' : 'bg-black/20'}`} />
                          LVL{l.n} {l.name}
                        </div>
                      ))}
                      <span className="ml-auto text-black/30 font-medium hidden md:block">Système anti-blocage triple fallback</span>
                    </div>

                    {error && (
                      <div className="mt-3 px-4 py-3 rounded-[12px] bg-[#ff0050]/10 border border-[#ff0050]/15 text-[13px] font-medium text-[#ff0050] flex gap-2">
                        <span className="mt-[1px]">⚠️</span><span>{error}</span>
                      </div>
                    )}
                  </div>

                  <div className="mt-4 flex flex-wrap gap-2">
                    {['Sans filigrane', 'HD • 1080p', 'MP3 Audio', 'Gratuit • Illimité', 'Pas de compte requis'].map((t) => (
                      <span key={t} className="px-3 py-1.5 rounded-full bg-black/[0.04] border border-black/[0.06] text-[11px] font-semibold text-black/60">{t}</span>
                    ))}
                  </div>
                </div>

                <div className="md:sticky md:top-[88px]">
                  <div className="rounded-[24px] bg-white border border-black/[0.08] shadow-[0_20px_60px_rgba(0,0,0,0.08)] overflow-hidden">
                    {!info ? (
                      <div className="p-7">
                        <div className="aspect-[9/13] rounded-[16px] bg-gradient-to-b from-[#f6f6f8] to-[#efeff2] border border-black/[0.04] relative overflow-hidden flex flex-col items-center justify-center">
                          <div className="absolute inset-0">
                            <div className="absolute inset-0 bg-[linear-gradient(transparent_0%,rgba(0,0,0,0.02)_50%,transparent_100%)] h-[40%] w-full" style={{ animation: 'scan 3s linear infinite' }} />
                          </div>
                          <div className="w-12 h-12 rounded-full bg-black/5 flex items-center justify-center mb-4">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
                              <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                          </div>
                          <div className="text-[13px] font-semibold text-black/40">Aperçu vidéo ici</div>
                          <div className="text-[11px] text-black/30 mt-1 max-w-[200px] text-center leading-[1.4]">Colle un lien TikTok et lance le téléchargement</div>
                        </div>
                        <div className="mt-5 space-y-3">
                          <div className="h-3 rounded-full bg-black/5 w-[70%]" />
                          <div className="h-3 rounded-full bg-black/[0.03] w-[45%]" />
                        </div>
                      </div>
                    ) : (
                      <>
                        <div className="relative bg-black">
                          <video src={info.video_hd || info.video_full} poster={info.cover} controls playsInline className="w-full aspect-[9/12] object-contain" />
                          <div className="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-white/90 backdrop-blur text-[11px] font-bold tracking-wide shadow">HD • SANS FILIGRANE</div>
                        </div>
                        <div className="p-5">
                          <div className="flex items-start gap-3 mb-4">
                            <div className="w-10 h-10 rounded-full bg-black/5 overflow-hidden shrink-0">
                              {info.avatar ? <img src={info.avatar} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center font-bold">J</div>}
                            </div>
                            <div className="min-w-0">
                              <div className="font-bold text-[14px] leading-[1.2] truncate">{info.author}</div>
                              <div className="text-[12px] text-black/50 font-medium">{info.handle}</div>
                              <div className="text-[13px] leading-[1.4] mt-2 line-clamp-2 text-black/70">{info.title}</div>
                            </div>
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            <button onClick={() => grab(info.video_hd || info.video_full, `${handleFile}-hd.mp4`)} className="h-[44px] rounded-[12px] bg-black text-white text-[13px] font-bold flex items-center justify-center gap-2 hover:bg-black/90">
                              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="7 10 12 15 17 10" />
                                <line x1="12" y1="15" x2="12" y2="3" />
                              </svg>
                              Sans filigrane HD
                            </button>
                            <button onClick={() => grab(info.video_full, `${handleFile}-full.mp4`)} className="h-[44px] rounded-[12px] bg-[#00f2ea]/15 border border-[#00f2ea]/20 text-black text-[13px] font-bold flex items-center justify-center gap-2">⚡ Full HD</button>
                            <button onClick={() => grab(info.video_wm || info.video_full, `${handleFile}-wm.mp4`)} className="h-[44px] rounded-[12px] bg-white border border-black/10 text-[13px] font-semibold hover:bg-black/5">Avec filigrane</button>
                            <button onClick={() => grab(info.music, `${handleFile}.mp3`)} className="h-[44px] rounded-[12px] bg-white border border-black/10 text-[13px] font-semibold hover:bg-black/5 flex items-center justify-center gap-1.5">♫ MP3 Audio</button>
                          </div>
                          <div className="mt-3 text-[11px] text-black/40 text-center font-medium">Téléchargement direct • Sans redirection</div>
                        </div>
                      </>
                    )}
                  </div>
                  <div className="mt-3 px-4 py-3 rounded-[14px] bg-[#0a0a0f] text-white flex items-center gap-3">
                    <div className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center shrink-0">✓</div>
                    <div className="text-[12px] leading-[1.4]">
                      <span className="font-bold">100% anonyme</span> <span className="text-white/60">— On ne stocke rien. Tes vidéos ne passent que par un cache temporaire.</span>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section className="py-14 border-t border-black/[0.06]">
              <div className="flex items-end justify-between mb-8">
                <h2 className="text-[28px] font-black tracking-[-0.03em] leading-none">Comment ça marche</h2>
                <span className="text-[11px] font-bold tracking-[0.14em] text-black/30">3 ÉTAPES • 5 SECONDES</span>
              </div>
              <div className="grid md:grid-cols-3 gap-4">
                {[
                  { n: '01', t: 'Copie le lien', d: 'Sur TikTok, appuie sur Partager → Copier le lien. Ça marche avec vidéos, stories, photos.', icon: '🔗' },
                  { n: '02', t: 'Colle sur JUSTINTIK', d: 'Colle dans le champ ci-dessus. Le système teste 3 backends automatiquement.', icon: '⚡' },
                  { n: '03', t: 'Télécharge en HD', d: 'Preview instantanée + boutons HD, Full HD, MP3. Sans filigrane, gratuit.', icon: '⬇️' },
                ].map((s) => (
                  <div key={s.n} className="rounded-[18px] bg-white border border-black/[0.06] p-6">
                    <div className="flex items-center justify-between mb-5">
                      <div className="w-10 h-10 rounded-full bg-black text-white flex items-center justify-center text-[13px] font-black">{s.n}</div>
                      <div className="text-[20px]">{s.icon}</div>
                    </div>
                    <div className="font-bold text-[16px] mb-2">{s.t}</div>
                    <div className="text-[13px] leading-[1.5] text-black/60 font-medium">{s.d}</div>
                  </div>
                ))}
              </div>
            </section>

            <section className="pb-14">
              <h2 className="text-[28px] font-black tracking-[-0.03em] leading-none mb-8">Fonctionnalités PRO</h2>
              <div className="grid md:grid-cols-3 gap-4">
                {[
                  { title: 'Qualité HD & Full HD', desc: "Récupère le fichier source original sans filigrane, jusqu'en 1080p. Option avec filigrane conservée.", tag: 'HD' },
                  { title: 'MP3 Audio Direct', desc: 'Extrait la piste audio en un clic. Parfait pour sons, remix, podcasts TikTok.', tag: 'AUDIO' },
                  { title: '0 Pub, 0 Tracking', desc: 'Pas de popups, pas de cookies tiers. Interface noire & blanche, ultra rapide.', tag: 'PRO' },
                  { title: 'WhatsApp Support', desc: 'Un bug ? Écris direct à Justin sur WhatsApp. Réponse en < 10 min.', tag: '24/7' },
                ].map((f) => (
                  <div key={f.title} className="rounded-[18px] bg-[#f6f6f8] border border-black/[0.05] p-6 hover:bg-white hover:shadow-[0_12px_32px_rgba(0,0,0,0.06)] hover:border-black/10 transition">
                    <div className="flex items-center gap-2 mb-3">
                      <span className="px-2 py-0.5 rounded-full bg-black text-white text-[10px] font-bold tracking-wide">{f.tag}</span>
                    </div>
                    <div className="font-bold text-[15px] mb-2">{f.title}</div>
                    <div className="text-[13px] leading-[1.5] text-black/60 font-medium">{f.desc}</div>
